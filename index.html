<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Front | المهندس إبراهيم سعد</title>
    <meta name="description" content="موقع المهندس إبراهيم سعد لتصميم المواقع والمتاجر الإلكترونية.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkPrimary: '#1a202c' } } }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; overflow-x: hidden; }
        /* حل مشكلة تداخل الأزرار في الموبايل */
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-white pb-20">

    <button onclick="toggleDarkMode()" class="fixed top-24 left-4 z-[1001] bg-gray-800 dark:bg-yellow-400 text-white dark:text-black p-3 rounded-full shadow-lg text-sm">
        <i id="theme-icon" class="fas fa-moon"></i>
    </button>

    <div class="bg-red-600 text-white text-center py-2 font-bold text-[10px] md:text-sm sticky top-0 z-[1000]">
        ينتهي عرض الخصم الحصري خلال: <span id="countdown">00:00:00</span>
    </div>

    <header class="p-6 bg-white dark:bg-gray-800 shadow-md text-center">
        <h1 class="text-3xl font-extrabold text-blue-600 dark:text-blue-400">TURBO FRONT</h1>
        <p class="mt-1 text-sm font-bold">مهندس / إبراهيم سعد عبد المولى</p>
        
        <div class="flex filter-container overflow-x-auto gap-2 mt-4 px-2 justify-start md:justify-center">
            <button onclick="filterProducts('all')" class="whitespace-nowrap bg-blue-600 text-white px-5 py-2 rounded-full text-xs font-bold">الكل</button>
            <button onclick="filterProducts('web')" class="whitespace-nowrap bg-gray-200 dark:bg-gray-700 px-5 py-2 rounded-full text-xs">مواقع</button>
            <button onclick="filterProducts('e-store')" class="whitespace-nowrap bg-gray-200 dark:bg-gray-700 px-5 py-2 rounded-full text-xs">متاجر</button>
            <button onclick="filterProducts('invitation')" class="whitespace-nowrap bg-gray-200 dark:bg-gray-700 px-5 py-2 rounded-full text-xs">كروت فرح</button>
        </div>
    </header>

    <section class="container mx-auto py-6 px-4 grid grid-cols-1 gap-4">
        <div class="p-4 bg-white dark:bg-gray-800 rounded-xl shadow-sm border-r-4 border-blue-600 flex items-center gap-4">
            <i class="fas fa-rocket text-2xl text-blue-600"></i>
            <div>
                <h3 class="font-bold text-sm">سرعة فائقة</h3>
                <p class="text-[10px] opacity-70">تسليم خلال 48 ساعة فقط.</p>
            </div>
        </div>
    </section>

    <main class="container mx-auto p-4">
        <div id="products-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <footer class="fixed bottom-0 left-0 w-full bg-blue-600 text-white py-4 z-50 text-center shadow-lg">
        <p class="font-bold text-sm">Developed by: المهندس إبراهيم سعد عبد المولى</p>
    </footer>

    <script>
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            icon.classList.toggle('fa-moon');
            icon.classList.toggle('fa-sun');
        }

        // العداد
        let time = 86400; 
        setInterval(() => {
            let h = Math.floor(time / 3600);
            let m = Math.floor((time % 3600) / 60);
            let s = time % 60;
            document.getElementById('countdown').innerHTML = `${h}:${m}:${s}`;
            time--;
        }, 1000);
    </script>
    <script src="script.js"></script>
</body>
</html>
